[package]
name = "openquotacycle"
version = "0.2.0"
description = "Linux desktop app for planning AI coding quotas around the 5-hour window"
authors = ["oioi555", "Andrea Debernardi"]
edition = "2024"

[lib]
name = "openquotacycle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["image-png"] }
ksni = { version = "0.3.6", features = ["blocking"] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["formatting"] }
dirs = "6"
log = "0.4"
reqwest = { version = "0.13", features = ["blocking", "socks"] }
rquickjs = { version = "0.11", features = ["bindgen"] }
tauri-plugin-store = "2.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-log = "2.8"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tauri-plugin-window-state = "2.4"
regex-lite = "0.1.9"
aes-gcm = "0.10.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["global_shortcuts"] }
futures-util = "0.3"
oo7 = "0.6"
gtk = "0.18"
gdkx11 = "0.18"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
serial_test = "3.4.0"

[patch.crates-io]
# oo7 0.6.0 rejects Secret Service MIME params (`text/plain; charset=utf8`)
# that agy/go-keyring writes. Upstream fix is oo7#517, only in 0.7.0-alpha
# (rustc 1.95). Local 0.6.0 copy parses the type before ';'.
oo7 = { path = "vendor/oo7" }
# ksni 0.3.6 has no ProvideXdgActivationToken; Plasma sends it before Activate.
ksni = { path = "vendor/ksni" }
